<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <style>
    body {
      font-family: 'Noto Sans JP', 'Hiragino Sans', Meiryo, Arial, sans-serif;
      font-size: 12px;
      margin: 0;
      padding: 8px;
      color: #222;
    }
    h3 { margin: 0 0 4px 0; font-size: 14px; }
    .summary {
      color: #555;
      font-size: 11px;
      margin-bottom: 6px;
      padding-bottom: 6px;
      border-bottom: 1px solid #ddd;
    }
    .summary .counts span {
      display: inline-block;
      margin-right: 8px;
      font-weight: bold;
    }
    .summary .cnt-error { color: #c62828; }
    .summary .cnt-warn { color: #f57f17; }
    .summary .cnt-info { color: #1565c0; }
    .summary .meta-line { font-size: 10px; color: #888; margin-top: 2px; }
    .meta-line a { color: #1976d2; text-decoration: none; }
    .meta-line a:hover { text-decoration: underline; }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 10px;
      font-size: 11px;
      padding: 6px 0;
      border-bottom: 1px solid #eee;
      margin-bottom: 6px;
    }
    .filters label { cursor: pointer; user-select: none; }
    .filters input[type="checkbox"] { vertical-align: middle; }

    .notice {
      background: #fff8e1;
      padding: 6px 8px;
      font-size: 11px;
      border-radius: 3px;
      margin-bottom: 8px;
      color: #5d4037;
    }
    .section-heading {
      font-weight: bold;
      font-size: 11px;
      margin-top: 12px;
      margin-bottom: 4px;
      padding: 3px 6px;
      border-radius: 3px;
    }
    .section-ERROR { background: #ffebee; color: #c62828; }
    .section-WARN  { background: #fffde7; color: #f57f17; }
    .section-INFO  { background: #e3f2fd; color: #1565c0; }
    .finding {
      padding: 8px 8px 6px 8px;
      border-bottom: 1px solid #eee;
      transition: background 0.1s, opacity 0.1s;
      position: relative;
    }
    .finding.clickable { cursor: pointer; }
    .finding.clickable:hover { background: #f5f5f5; }
    .finding.resolved { opacity: 0.4; background: #fafafa; }
    .finding.resolved .rule-id::before { content: '✓ '; color: #43a047; }
    .finding-header {
      display: flex;
      align-items: baseline;
      gap: 6px;
      padding-right: 60px; /* resolve ボタン用スペース */
    }
    .rule-id { font-weight: bold; font-size: 11px; }
    .guideline-ref { color: #666; font-size: 10px; }
    .message { margin: 4px 0 2px 0; line-height: 1.4; }
    .snippet {
      color: #444;
      font-size: 11px;
      background: #fafafa;
      padding: 3px 6px;
      border-left: 2px solid #ccc;
      margin: 4px 0 0 0;
      border-radius: 0 2px 2px 0;
      word-break: break-all;
    }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 10px;
      color: #888;
      margin-top: 4px;
    }
    .impl-note { color: #999; font-size: 10px; font-style: italic; margin-top: 2px; }
    .empty {
      color: #777;
      padding: 16px;
      text-align: center;
      font-size: 12px;
    }
    .jump-hint { font-size: 10px; color: #1976d2; }

    .resolve-btn {
      position: absolute;
      top: 6px;
      right: 6px;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 3px;
      padding: 1px 6px;
      font-size: 10px;
      cursor: pointer;
      color: #555;
    }
    .resolve-btn:hover { background: #f0f0f0; border-color: #999; }
    .finding.resolved .resolve-btn { background: #e8f5e9; border-color: #66bb6a; color: #2e7d32; }

    .apply-btn {
      position: absolute;
      top: 6px;
      right: 64px;
      background: #fffbe6;
      border: 1px solid #fbc02d;
      border-radius: 3px;
      padding: 1px 6px;
      font-size: 10px;
      cursor: pointer;
      color: #795548;
    }
    .apply-btn:hover { background: #fff59d; border-color: #f9a825; }
    .apply-btn:disabled { opacity: 0.6; cursor: wait; }
    .apply-btn.applied { background: #c8e6c9; border-color: #43a047; color: #1b5e20; cursor: default; }
    .finding.applied { background: #f1f8e9; }
    .finding.applied .rule-id::after { content: ' ⚡'; color: #43a047; }

    .actions {
      font-size: 11px;
      margin-bottom: 6px;
    }
    .actions button {
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 3px;
      padding: 2px 8px;
      cursor: pointer;
      font-size: 11px;
      color: #555;
    }
    .actions button:hover { background: #f0f0f0; }
  </style>
</head>
<body>
  <h3>マニュアルチェック結果</h3>
  <div class="summary">
    <div class="counts">
      <span class="cnt-error">ERROR <span id="cnt-error">0</span></span>
      <span class="cnt-warn">WARN <span id="cnt-warn">0</span></span>
      <span class="cnt-info">INFO <span id="cnt-info">0</span></span>
    </div>
    <div class="meta-line">
      実行: <?= timestamp ?>
      <? if (rulesVersion) { ?> / rules <?= rulesVersion ?><? } ?>
      <? if (ref) { ?> / ref <?= ref ?><? } ?>
      <? if (sha) { ?>
        / <a href="https://github.com/MatsumotoDesuyo/team-mirai-manual-lint/commit/<?= sha ?>" target="_blank"><?= sha ?></a>
      <? } ?>
    </div>
  </div>

  <div class="filters">
    <label><input type="checkbox" id="filter-error" checked> ERROR</label>
    <label><input type="checkbox" id="filter-warn" checked> WARN</label>
    <label><input type="checkbox" id="filter-info" checked> INFO</label>
    <label><input type="checkbox" id="filter-resolved"> 解決済みも表示</label>
  </div>

  <div class="actions">
    <button onclick="clearResolved()" title="この Doc の解決済みマークを全てクリア">解決済みを全クリア</button>
  </div>

  <div id="todo-notice" style="display:none" class="notice"></div>

  <div id="findings"></div>

  <script>
    var FINDINGS = <?!= JSON.stringify(findings) ?>;
    var DOC_ID = <?!= JSON.stringify(docId) ?>;
    var RESOLVED_PREFIX = 'tm-lint:resolved:' + DOC_ID + ':';
    var APPLIED_PREFIX = 'tm-lint:applied:' + DOC_ID + ':';

    function isJumpable(f) {
      if (!f.location) return false;
      if (f.location.type !== 'paragraph' && f.location.type !== 'run') return false;
      if (typeof f.location.index !== 'number' || f.location.index < 0) return false;
      return true;
    }

    function escapeHtml(s) {
      if (s == null) return '';
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function jumpTo(idx) {
      var f = FINDINGS[idx];
      if (!isJumpable(f)) return;
      var startOffset = (typeof f.startOffset === 'number') ? f.startOffset : null;
      var endOffset = (typeof f.endOffset === 'number') ? f.endOffset : null;
      google.script.run
        .withFailureHandler(function(err) { console.error('jumpTo failed:', err); })
        .tmLintJumpTo(f.location.index, startOffset, endOffset);
    }

    // 解決済み状態の key: ruleId + 内容の安定 hash
    function resolvedKey(f) {
      var sigParts = [
        f.ruleId,
        (f.location && typeof f.location.index === 'number') ? f.location.index : '',
        (typeof f.startOffset === 'number') ? f.startOffset : '',
        (f.snippet || '').substring(0, 40)
      ];
      return RESOLVED_PREFIX + sigParts.join('|');
    }

    function isResolved(f) {
      try { return localStorage.getItem(resolvedKey(f)) === '1'; }
      catch (e) { return false; }
    }

    function setResolved(f, val) {
      try {
        if (val) localStorage.setItem(resolvedKey(f), '1');
        else localStorage.removeItem(resolvedKey(f));
      } catch (e) {}
    }

    function toggleResolved(event, idx) {
      event.stopPropagation();
      var f = FINDINGS[idx];
      setResolved(f, !isResolved(f));
      applyFilters();
    }

    function clearResolved() {
      try {
        var keys = [];
        for (var i = 0; i < localStorage.length; i++) {
          var k = localStorage.key(i);
          if (k && k.indexOf(RESOLVED_PREFIX) === 0) keys.push(k);
        }
        for (var j = 0; j < keys.length; j++) localStorage.removeItem(keys[j]);
        applyFilters();
      } catch (e) {}
    }

    // 適用済み状態の key（解決済みと同じハッシュ規則）
    function appliedKey(f) {
      var sigParts = [
        f.ruleId,
        (f.location && typeof f.location.index === 'number') ? f.location.index : '',
        (typeof f.startOffset === 'number') ? f.startOffset : '',
        (f.snippet || '').substring(0, 40)
      ];
      return APPLIED_PREFIX + sigParts.join('|');
    }
    function isApplied(f) {
      try { return localStorage.getItem(appliedKey(f)) === '1'; }
      catch (e) { return false; }
    }
    function markApplied(f) {
      try { localStorage.setItem(appliedKey(f), '1'); } catch (e) {}
    }

    function canApply(f) {
      return f && f.severity === 'ERROR' && f.autoFixable === true;
    }

    function applyFix(event, idx) {
      event.stopPropagation();
      var f = FINDINGS[idx];
      if (!canApply(f)) return;
      var btn = event.currentTarget;
      var original = btn.textContent;
      btn.disabled = true;
      btn.textContent = '⏳ 適用中…';
      google.script.run
        .withSuccessHandler(function(result) {
          btn.disabled = false;
          if (result && result.ok) {
            btn.textContent = '✅ 適用済';
            btn.classList.add('applied');
            markApplied(f);
            var elem = btn.closest('.finding');
            if (elem) elem.classList.add('applied');
          } else {
            btn.textContent = original;
            alert('適用失敗: ' + (result && result.error ? result.error : '不明なエラー'));
          }
        })
        .withFailureHandler(function(err) {
          btn.disabled = false;
          btn.textContent = original;
          alert('適用エラー: ' + (err && err.message ? err.message : err));
        })
        .tmLintApplyFix(JSON.stringify(f));
    }

    function renderFinding(f, idx) {
      var jumpable = isJumpable(f);
      var hint = (f.location && f.location.hint) ? f.location.hint : '';
      var resolved = isResolved(f);
      var applied = isApplied(f);
      var applicable = canApply(f);
      var html = '';
      html += '<div class="finding ' + (jumpable ? 'clickable ' : '') + (resolved ? 'resolved ' : '') + (applied ? 'applied ' : '') + '"';
      html += ' data-severity="' + escapeHtml(f.severity || 'INFO') + '"';
      html += ' data-resolved="' + (resolved ? '1' : '0') + '"';
      html += ' data-idx="' + idx + '"';
      if (jumpable) html += ' onclick="jumpTo(' + idx + ')"';
      html += '>';
      html += '<button class="resolve-btn" onclick="toggleResolved(event, ' + idx + ')">';
      html += resolved ? '↩ 戻す' : '✓ 解決';
      html += '</button>';
      if (applicable) {
        html += '<button class="apply-btn ' + (applied ? 'applied' : '') + '" onclick="applyFix(event, ' + idx + ')">';
        html += applied ? '✅ 適用済' : '⚡ 適用';
        html += '</button>';
      }
      html += '<div class="finding-header">';
      html += '<span class="rule-id">[' + escapeHtml(f.ruleId) + ']</span>';
      if (f.guidelineRef) {
        html += '<span class="guideline-ref">' + escapeHtml(f.guidelineRef) + '</span>';
      }
      html += '</div>';
      if (f.message) html += '<div class="message">' + escapeHtml(f.message) + '</div>';
      if (f.snippet) html += '<div class="snippet">' + escapeHtml(f.snippet) + '</div>';
      var metaParts = [];
      if (hint) metaParts.push('位置: ' + escapeHtml(hint));
      if (jumpable) metaParts.push('<span class="jump-hint">▶ クリックで該当箇所へ</span>');
      if (metaParts.length) html += '<div class="meta">' + metaParts.join(' / ') + '</div>';
      if (f.implementationNote) html += '<div class="impl-note">実装方針: ' + escapeHtml(f.implementationNote) + '</div>';
      html += '</div>';
      return html;
    }

    function render() {
      var grouped = { ERROR: [], WARN: [], INFO: [] };
      var todoCount = 0;
      for (var i = 0; i < FINDINGS.length; i++) {
        var sev = FINDINGS[i].severity || 'INFO';
        if (!grouped[sev]) sev = 'INFO';
        grouped[sev].push(i);
        if (FINDINGS[i].implementationNote) todoCount++;
      }
      document.getElementById('cnt-error').textContent = grouped.ERROR.length;
      document.getElementById('cnt-warn').textContent = grouped.WARN.length;
      document.getElementById('cnt-info').textContent = grouped.INFO.length;

      if (todoCount > 0) {
        var notice = document.getElementById('todo-notice');
        notice.style.display = '';
        notice.textContent = '未実装ハンドラ ' + todoCount + ' 件（INFO セクションを参照）';
      }

      var container = document.getElementById('findings');
      if (FINDINGS.length === 0) {
        container.innerHTML = '<div class="empty">指摘はありません</div>';
        return;
      }

      var html = '';
      var sections = [
        { key: 'ERROR', label: 'ERROR（決定論違反）' },
        { key: 'WARN',  label: 'WARN（LLM 助言）' },
        { key: 'INFO',  label: 'INFO（人間確認 / 雛形）' }
      ];
      for (var s = 0; s < sections.length; s++) {
        var ids = grouped[sections[s].key];
        if (ids.length === 0) continue;
        html += '<div class="section-heading section-' + sections[s].key
              + '" data-section="' + sections[s].key + '">'
              + sections[s].label + ' (' + ids.length + ')</div>';
        for (var j = 0; j < ids.length; j++) {
          html += renderFinding(FINDINGS[ids[j]], ids[j]);
        }
      }
      container.innerHTML = html;
    }

    function applyFilters() {
      var showError = document.getElementById('filter-error').checked;
      var showWarn = document.getElementById('filter-warn').checked;
      var showInfo = document.getElementById('filter-info').checked;
      var showResolved = document.getElementById('filter-resolved').checked;

      var findings = document.querySelectorAll('.finding');
      // 各 finding の表示判定と、resolved クラスの更新
      for (var i = 0; i < findings.length; i++) {
        var el = findings[i];
        var sev = el.dataset.severity;
        var idx = parseInt(el.dataset.idx, 10);
        var f = FINDINGS[idx];
        var resolved = isResolved(f);
        if (resolved) el.classList.add('resolved');
        else el.classList.remove('resolved');
        el.dataset.resolved = resolved ? '1' : '0';
        // ボタンラベル更新
        var btn = el.querySelector('.resolve-btn');
        if (btn) btn.textContent = resolved ? '↩ 戻す' : '✓ 解決';

        var sevOk = (sev === 'ERROR' && showError) ||
                    (sev === 'WARN' && showWarn) ||
                    (sev === 'INFO' && showInfo);
        var resolvedOk = showResolved || !resolved;
        el.style.display = (sevOk && resolvedOk) ? '' : 'none';
      }

      // セクション見出しの表示判定: そのセクションに表示中の Finding が無ければ非表示
      var sections = document.querySelectorAll('.section-heading');
      for (var s = 0; s < sections.length; s++) {
        var key = sections[s].dataset.section;
        var ok = false;
        if (key === 'ERROR' && showError) ok = true;
        else if (key === 'WARN' && showWarn) ok = true;
        else if (key === 'INFO' && showInfo) ok = true;
        // 解決済みフィルタも考慮: そのセクションに非解決が 1 つでもあれば表示
        if (ok && !showResolved) {
          // セクション直後の同 section の finding を確認
          var anyVisible = false;
          var next = sections[s].nextElementSibling;
          while (next && !next.classList.contains('section-heading')) {
            if (next.classList.contains('finding') &&
                next.dataset.severity === key &&
                next.dataset.resolved !== '1') {
              anyVisible = true; break;
            }
            next = next.nextElementSibling;
          }
          ok = anyVisible;
        }
        sections[s].style.display = ok ? '' : 'none';
      }
    }

    document.getElementById('filter-error').addEventListener('change', applyFilters);
    document.getElementById('filter-warn').addEventListener('change', applyFilters);
    document.getElementById('filter-info').addEventListener('change', applyFilters);
    document.getElementById('filter-resolved').addEventListener('change', applyFilters);

    render();
    applyFilters();
  </script>
</body>
</html>
